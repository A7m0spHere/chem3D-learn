name: Visual regression (Linux baselines)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          verify: run the visual suite against committed baselines.
          rebuild: regenerate Linux snapshots on a review branch and open a PR.
        required: true
        default: verify
        type: choice
        options:
          - verify
          - rebuild

concurrency:
  group: visual-regression
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run visual suite (verify)
        if: inputs.mode == 'verify'
        run: npm run test:visual

      - name: Regenerate Linux snapshots (rebuild)
        if: inputs.mode == 'rebuild'
        run: npx playwright test --update-snapshots

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ inputs.mode }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Open baseline review PR (rebuild)
        if: inputs.mode == 'rebuild' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain tests)" ]; then
            echo "No snapshot changes produced; nothing to propose." | tee "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="visual-baselines/linux-rebuild-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add tests
          git commit -m "test(visual): rebuild linux snapshot baselines"
          git push -u origin "$BRANCH"

          {
            echo "## Visual baseline rebuild (Linux)"
            echo ""
            echo "New \`*-linux.png\` baselines generated by the \`visual-regression\`"
            echo "workflow in \`rebuild\` mode. Existing \`*-darwin.png\` files are untouched."
            echo ""
            echo "**Review guidance**"
            echo "- Review every changed/new PNG before merging; merging without review defeats the purpose."
            echo "- Chemistry geometry, atom coordinates and teaching copy must not change together with the baselines."
            echo "- After this PR merges and a follow-up \`verify\` run is green twice, the stale \*-darwin.png set can be cleaned up separately."
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > body.md
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "test(visual): rebuild Linux snapshot baselines" \
            --body-file body.md | tee "$GITHUB_STEP_SUMMARY"
