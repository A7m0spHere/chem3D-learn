name: Visual regression (Linux baselines)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          verify: run the visual suite against committed baselines.
          rebuild: regenerate Linux snapshots on a review branch and open a PR.
        required: true
        default: verify
        type: choice
        options:
          - verify
          - rebuild
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/visual-regression.yml"

concurrency:
  # PR 各自排队、新提交取消旧运行；手动触发共用 manual 组且不互相取消
  group: visual-regression-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'manual' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

env:
  # PR 触发时 inputs.mode 为空，一律按 verify 执行；rebuild 仅限手动触发
  RUN_MODE: ${{ inputs.mode || 'verify' }}

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run visual suite (verify)
        if: env.RUN_MODE == 'verify'
        run: npm run test:visual

      - name: Regenerate Linux snapshots (rebuild)
        if: env.RUN_MODE == 'rebuild'
        run: npm run test:visual:update

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ env.RUN_MODE }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Backup produced Linux snapshots when rebuild fails
        if: failure() && inputs.mode == 'rebuild'
        uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots-partial
          path: frontend/tests/**/*-linux.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Open baseline review PR (rebuild)
        if: inputs.mode == 'rebuild' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain tests)" ]; then
            echo "No snapshot changes produced; nothing to propose." | tee "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="visual-baselines/linux-rebuild-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add tests
          git commit -m "test(visual): rebuild linux snapshot baselines"
          git push -u origin "$BRANCH"

          # 仓库需在 Settings → Actions → General → Workflow permissions
          # 勾选「Allow GitHub Actions to create and approve pull requests」，
          # 否则分支已推送、PR 建不出来（run 33091976613 即此情形，PR #4
          # 由维护者 gh CLI 手动补开）。
          {
            echo "## Visual baseline rebuild (Linux)"
            echo ""
            echo "New \`*-linux.png\` baselines generated by the \`visual-regression\`"
            echo "workflow in \`rebuild\` mode. Existing \`*-darwin.png\` files are untouched."
            echo ""
            echo "**Review guidance**"
            echo "- Review every changed/new PNG before merging; merging without review defeats the purpose."
            echo "- Chemistry geometry, atom coordinates and teaching copy must not change together with the baselines."
            echo "- After this PR merges and a follow-up \`verify\` run is green twice, the stale *-darwin.png set can be cleaned up separately."
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > body.md
          if ! gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "test(visual): rebuild linux snapshot baselines" \
            --body-file body.md | tee "$GITHUB_STEP_SUMMARY"; then
            echo "::warning::gh pr create failed - the branch was pushed; open the PR manually from the branch link above." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
